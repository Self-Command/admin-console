name: Workspace Verify

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*'
      - 'eslint.config.mjs'
      - '.github/workflows/workspace-verify.yml'
      - '.github/workflows/workspace-image.yml'
      - '.github/scripts/workspace-secret-scan.sh'
  push:
    branches:
      - main
      - workspace/dev
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*'
      - 'eslint.config.mjs'
      - '.github/workflows/workspace-verify.yml'
      - '.github/workflows/workspace-image.yml'
      - '.github/scripts/workspace-secret-scan.sh'
  workflow_dispatch:

concurrency:
  group: workspace-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Scan changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash .github/scripts/workspace-secret-scan.sh "$BASE_SHA"

  verify:
    name: Typecheck, lint and test
    needs: secret-scan
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: admin_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d admin_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          ADMIN_API_TEST_DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/admin_e2e
      - name: Permission matrix (HTTP e2e)
        run: pnpm --filter @admin/api test:e2e
        env:
          ADMIN_API_E2E_DATABASE_URL: postgres://admin:admin@127.0.0.1:5432/admin_e2e

  lexicon-contract:
    name: Lexicon contract
    needs: secret-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lex:check
      - run: pnpm lex:gen
      - name: Fail on generated drift
        run: git diff --exit-code
